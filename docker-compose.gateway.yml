# Local-development Gateway profile (LocalFile secrets, bootstrap-issued credentials).
# Usage: docker compose -f docker-compose.yml -f docker-compose.gateway.yml up --build
# The Gateway is the only published entry point; the API runs in Gateway authentication mode.
# The runtime image has no curl/wget, so probe /healthz over bash's /dev/tcp.
x-healthcheck: &healthcheck
  test:
    - CMD
    - bash
    - -c
    - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200'"
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 5s

x-gateway-data: &gateway-data
  ConnectionStrings__GatewayPolicy: Host=gateway-postgres;Port=5432;Database=gateway_policy;Username=gateway;Password=${GATEWAY_POSTGRES_PASSWORD:-local-dev-only-postgres};GSS Encryption Mode=Disable
  Secrets__Provider: LocalFile
  Secrets__Directory: /secrets

services:
  gateway-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway_policy
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${GATEWAY_POSTGRES_PASSWORD:-local-dev-only-postgres}
    volumes:
      - gateway-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gateway -d gateway_policy']
      interval: 5s
      timeout: 3s
      retries: 20

  gateway-bootstrap:
    build:
      context: .
      dockerfile: src/TransactionValidation.Gateway.LocalBootstrap/Dockerfile
    restart: 'no'
    environment:
      <<: *gateway-data
      DOTNET_ENVIRONMENT: Development
      Gateway__BackendCredentialManagement__PepperVersion: backend-pepper-v1
    volumes:
      - ./.secrets:/secrets
    depends_on:
      gateway-postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: src/TransactionValidation.Gateway/Dockerfile
    ports:
      - '${GATEWAY_HOST_PORT:-5100}:8080'
    environment:
      <<: *gateway-data
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - ./.secrets:/secrets
    healthcheck: *healthcheck
    depends_on:
      gateway-bootstrap:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  api:
    ports: !reset []
    environment:
      <<: *gateway-data
      SECURITY__AUTHENTICATIONMODE: Gateway
    healthcheck: *healthcheck
    volumes:
      - ./.secrets:/secrets
    depends_on:
      gateway-bootstrap:
        condition: service_completed_successfully

volumes:
  gateway-postgres-data:
