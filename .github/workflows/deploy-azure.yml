name: Deploy to Azure

# Runs on every push touching application code: build both images on the runner,
# push them to ACR, then point the existing Container Apps at the freshly built
# tags. Never touches infra/bicep (see infra.yml for that).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # Must match the --name used in infra.yml's `az deployment sub create` so outputs can be queried.
  INFRA_DEPLOYMENT_NAME: txv-infra-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve resource names from infra deployment outputs
        run: |
          outputs=$(az deployment sub show \
            --name "${{ env.INFRA_DEPLOYMENT_NAME }}" \
            --query properties.outputs -o json)

          echo "RESOURCE_GROUP=$(echo "$outputs" | jq -r '.resourceGroupName.value')" >> "$GITHUB_ENV"
          echo "ACR_NAME=$(echo "$outputs" | jq -r '.acrName.value')" >> "$GITHUB_ENV"
          echo "API_APP_NAME=$(echo "$outputs" | jq -r '.apiAppName.value')" >> "$GITHUB_ENV"
          echo "MOCK_APP_NAME=$(echo "$outputs" | jq -r '.mockAppName.value')" >> "$GITHUB_ENV"

      # ACR Tasks (az acr build) is blocked on this subscription with
      # TasksOperationsNotAllowed, so images are built on the runner instead.
      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push API image
        run: |
          docker build \
            --file src/TransactionValidation.Api/Dockerfile \
            --tag ${{ env.ACR_NAME }}.azurecr.io/txv-api:${{ github.sha }} \
            .
          docker push ${{ env.ACR_NAME }}.azurecr.io/txv-api:${{ github.sha }}

      - name: Build and push Mock image
        run: |
          docker build \
            --file src/TransactionValidation.Mock/Dockerfile \
            --tag ${{ env.ACR_NAME }}.azurecr.io/txv-mock:${{ github.sha }} \
            .
          docker push ${{ env.ACR_NAME }}.azurecr.io/txv-mock:${{ github.sha }}

      - name: Update API Container App revision
        run: |
          az containerapp update \
            --name ${{ env.API_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/txv-api:${{ github.sha }}

      - name: Update Mock Container App revision
        run: |
          az containerapp update \
            --name ${{ env.MOCK_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/txv-mock:${{ github.sha }}
