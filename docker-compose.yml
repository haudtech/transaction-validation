version: '3.9'
services:
  api:
    env_file:
      - .env
    build:
      context: .
      dockerfile: src/TransactionValidation.Api/Dockerfile
    ports:
      - '${API_HOST_PORT:?API_HOST_PORT must be set in .env}:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?ASPNETCORE_ENVIRONMENT must be set in .env}
      SECURITY__APIKEY: ${SECURITY__APIKEY:?SECURITY__APIKEY must be set in .env}
      RABBITMQ__HOSTNAME: ${RABBITMQ__HOSTNAME:?RABBITMQ__HOSTNAME must be set in .env}
      RABBITMQ__PORT: ${RABBITMQ__PORT:?RABBITMQ__PORT must be set in .env}
      RABBITMQ__USERNAME: ${RABBITMQ__USERNAME:?RABBITMQ__USERNAME must be set in .env}
      RABBITMQ__PASSWORD: ${RABBITMQ__PASSWORD:?RABBITMQ__PASSWORD must be set in .env}
      RABBITMQ__QUEUENAME: ${RABBITMQ__QUEUENAME:?RABBITMQ__QUEUENAME must be set in .env}
      RABBITMQ__EXCHANGENAME: ${RABBITMQ__EXCHANGENAME:?RABBITMQ__EXCHANGENAME must be set in .env}
      RABBITMQ__EXCHANGETYPE: ${RABBITMQ__EXCHANGETYPE:?RABBITMQ__EXCHANGETYPE must be set in .env}
      RABBITMQ__ROUTINGKEYPREFIX: ${RABBITMQ__ROUTINGKEYPREFIX:?RABBITMQ__ROUTINGKEYPREFIX must be set in .env}
      RABBITMQ__ALTERNATEEXCHANGENAME: ${RABBITMQ__ALTERNATEEXCHANGENAME:?RABBITMQ__ALTERNATEEXCHANGENAME must be set in .env}
      RABBITMQ__UNROUTEDQUEUENAME: ${RABBITMQ__UNROUTEDQUEUENAME:?RABBITMQ__UNROUTEDQUEUENAME must be set in .env}
      PARTNERVERIFICATION__BASEURL: ${PARTNERVERIFICATION__BASEURL:?PARTNERVERIFICATION__BASEURL must be set in .env}
      APPLICATIONINSIGHTS__CONNECTIONSTRING: ${APPLICATIONINSIGHTS__CONNECTIONSTRING}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mock:
        condition: service_started

  mock:
    env_file:
      - .env
    build:
      context: .
      dockerfile: src/TransactionValidation.Mock/Dockerfile
    ports:
      - '5002:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?ASPNETCORE_ENVIRONMENT must be set in .env}
      RABBITMQCONSUMER__HOSTNAME: ${RABBITMQ__HOSTNAME:?RABBITMQ__HOSTNAME must be set in .env}
      RABBITMQCONSUMER__PORT: ${RABBITMQ__PORT:?RABBITMQ__PORT must be set in .env}
      RABBITMQCONSUMER__USERNAME: ${RABBITMQ__USERNAME:?RABBITMQ__USERNAME must be set in .env}
      RABBITMQCONSUMER__PASSWORD: ${RABBITMQ__PASSWORD:?RABBITMQ__PASSWORD must be set in .env}
      RABBITMQCONSUMER__QUEUENAME: ${RABBITMQ__QUEUENAME:?RABBITMQ__QUEUENAME must be set in .env}
      RABBITMQCONSUMER__EXCHANGENAME: ${RABBITMQ__EXCHANGENAME:?RABBITMQ__EXCHANGENAME must be set in .env}
      RABBITMQCONSUMER__ALTERNATEEXCHANGENAME: ${RABBITMQ__ALTERNATEEXCHANGENAME:?RABBITMQ__ALTERNATEEXCHANGENAME must be set in .env}
      RABBITMQCONSUMER__BINDINGPATTERN: ${RABBITMQCONSUMER__BINDINGPATTERN:?RABBITMQCONSUMER__BINDINGPATTERN must be set in .env}
      RABBITMQCONSUMER__UNROUTEDQUEUENAME: ${RABBITMQ__UNROUTEDQUEUENAME:?RABBITMQ__UNROUTEDQUEUENAME must be set in .env}
      RABBITMQCONSUMER__DURABLE: ${RABBITMQCONSUMER__DURABLE:?RABBITMQCONSUMER__DURABLE must be set in .env}
      RABBITMQCONSUMER__AUTOACK: ${RABBITMQCONSUMER__AUTOACK:?RABBITMQCONSUMER__AUTOACK must be set in .env}
      RABBITMQAUDITCONSUMER__HOSTNAME: ${RABBITMQ__HOSTNAME:?RABBITMQ__HOSTNAME must be set in .env}
      RABBITMQAUDITCONSUMER__PORT: ${RABBITMQ__PORT:?RABBITMQ__PORT must be set in .env}
      RABBITMQAUDITCONSUMER__USERNAME: ${RABBITMQ__USERNAME:?RABBITMQ__USERNAME must be set in .env}
      RABBITMQAUDITCONSUMER__PASSWORD: ${RABBITMQ__PASSWORD:?RABBITMQ__PASSWORD must be set in .env}
      RABBITMQAUDITCONSUMER__QUEUENAME: ${RABBITMQAUDITCONSUMER__QUEUENAME:?RABBITMQAUDITCONSUMER__QUEUENAME must be set in .env}
      RABBITMQAUDITCONSUMER__EXCHANGENAME: ${RABBITMQ__EXCHANGENAME:?RABBITMQ__EXCHANGENAME must be set in .env}
      RABBITMQAUDITCONSUMER__BINDINGPATTERN: ${RABBITMQAUDITCONSUMER__BINDINGPATTERN:?RABBITMQAUDITCONSUMER__BINDINGPATTERN must be set in .env}
      RABBITMQAUDITCONSUMER__DURABLE: ${RABBITMQAUDITCONSUMER__DURABLE:?RABBITMQAUDITCONSUMER__DURABLE must be set in .env}
      RABBITMQAUDITCONSUMER__AUTOACK: ${RABBITMQAUDITCONSUMER__AUTOACK:?RABBITMQAUDITCONSUMER__AUTOACK must be set in .env}
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    env_file:
      - .env
    image: rabbitmq:3.12-management
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ__USERNAME:?RABBITMQ__USERNAME must be set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ__PASSWORD:?RABBITMQ__PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
