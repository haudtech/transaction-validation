version: '3.9'
services:
  api:
    env_file:
      - .env
    build:
      context: .
      dockerfile: src/TransactionValidation.Api/Dockerfile
    ports:
      - '${API_HOST_PORT:-5000}:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      SECURITY__APIKEY: ${SECURITY__APIKEY:-local-dev-api-key}
      MESSAGING__BROKERTYPE: ${MESSAGING__BROKERTYPE:-RabbitMq}
      RABBITMQ__HOSTNAME: ${RABBITMQ__HOSTNAME:-rabbitmq}
      RABBITMQ__PORT: ${RABBITMQ__PORT:-5672}
      RABBITMQ__USERNAME: ${RABBITMQ__USERNAME:-guest}
      RABBITMQ__PASSWORD: ${RABBITMQ__PASSWORD:-guest}
      RABBITMQ__QUEUENAME: ${RABBITMQ__QUEUENAME:-partner-transactions}
      SERVICEBUSPUBLISHER__CONNECTIONSTRING: ${SERVICEBUSPUBLISHER__CONNECTIONSTRING:-}
      SERVICEBUSPUBLISHER__TOPICNAME: ${SERVICEBUSPUBLISHER__TOPICNAME:-partner.transactions}
      SERVICEBUSPUBLISHER__SUBJECT: ${SERVICEBUSPUBLISHER__SUBJECT:-partner.transaction.created}
      SERVICEBUSPUBLISHER__ROUTINGKEY: ${SERVICEBUSPUBLISHER__ROUTINGKEY:-partner.transaction.created}
      SERVICEBUSPUBLISHER__EVENTTYPE: ${SERVICEBUSPUBLISHER__EVENTTYPE:-partner.transaction.created}
      PARTNERVERIFICATION__BASEURL: ${PARTNERVERIFICATION__BASEURL:-http://mock:8080/}
      APPLICATIONINSIGHTS__CONNECTIONSTRING: ${APPLICATIONINSIGHTS__CONNECTIONSTRING:-}
    depends_on:
      rabbitmq:
        condition: service_started
      mock:
        condition: service_started

  mock:
    env_file:
      - .env
    build:
      context: .
      dockerfile: src/TransactionValidation.Mock/Dockerfile
    ports:
      - '5002:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      MESSAGING__BROKERTYPE: ${MESSAGING__BROKERTYPE:-RabbitMq}
      RABBITMQCONSUMER__HOSTNAME: ${RABBITMQ__HOSTNAME:-rabbitmq}
      RABBITMQCONSUMER__PORT: ${RABBITMQ__PORT:-5672}
      RABBITMQCONSUMER__USERNAME: ${RABBITMQ__USERNAME:-guest}
      RABBITMQCONSUMER__PASSWORD: ${RABBITMQ__PASSWORD:-guest}
      RABBITMQCONSUMER__QUEUENAME: ${RABBITMQ__QUEUENAME:-partner-transactions}
      RABBITMQCONSUMER__DURABLE: ${RABBITMQCONSUMER__DURABLE:-true}
      RABBITMQCONSUMER__AUTOACK: ${RABBITMQCONSUMER__AUTOACK:-false}
      SERVICEBUSCONSUMER__ENABLED: ${SERVICEBUSCONSUMER__ENABLED:-false}
      SERVICEBUSCONSUMER__CONNECTIONSTRING: ${SERVICEBUSCONSUMER__CONNECTIONSTRING:-}
      SERVICEBUSCONSUMER__TOPICNAME: ${SERVICEBUSCONSUMER__TOPICNAME:-partner.transactions}
      SERVICEBUSCONSUMER__SUBSCRIPTIONNAME: ${SERVICEBUSCONSUMER__SUBSCRIPTIONNAME:-partner-transactions}
      SERVICEBUSCONSUMER__FILTER: ${SERVICEBUSCONSUMER__FILTER:-}
      SERVICEBUSCONSUMER__AUTOCOMPLETE: ${SERVICEBUSCONSUMER__AUTOCOMPLETE:-false}
      SERVICEBUSCONSUMER__MAXCONCURRENTCALLS: ${SERVICEBUSCONSUMER__MAXCONCURRENTCALLS:-1}
      SERVICEBUSAUDITCONSUMER__ENABLED: ${SERVICEBUSAUDITCONSUMER__ENABLED:-false}
      SERVICEBUSAUDITCONSUMER__CONNECTIONSTRING: ${SERVICEBUSAUDITCONSUMER__CONNECTIONSTRING:-}
      SERVICEBUSAUDITCONSUMER__TOPICNAME: ${SERVICEBUSAUDITCONSUMER__TOPICNAME:-partner.transactions}
      SERVICEBUSAUDITCONSUMER__SUBSCRIPTIONNAME: ${SERVICEBUSAUDITCONSUMER__SUBSCRIPTIONNAME:-partner-transactions.audit}
      SERVICEBUSAUDITCONSUMER__FILTER: ${SERVICEBUSAUDITCONSUMER__FILTER:-}
      SERVICEBUSAUDITCONSUMER__AUTOCOMPLETE: ${SERVICEBUSAUDITCONSUMER__AUTOCOMPLETE:-false}
      SERVICEBUSAUDITCONSUMER__MAXCONCURRENTCALLS: ${SERVICEBUSAUDITCONSUMER__MAXCONCURRENTCALLS:-1}

  rabbitmq:
    env_file:
      - .env
    image: rabbitmq:3.12-management
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ__USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ__PASSWORD:-guest}
