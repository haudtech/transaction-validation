version: '3.9'
services:
  api:
    env_file:
      - .env
    build:
      context: .
      dockerfile: src/TransactionValidation.Api/Dockerfile
    ports:
      - '${API_HOST_PORT:-5000}:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      SECURITY__APIKEY: ${SECURITY__APIKEY:-local-dev-api-key}
      RABBITMQ__HOSTNAME: ${RABBITMQ__HOSTNAME:-rabbitmq}
      RABBITMQ__PORT: ${RABBITMQ__PORT:-5672}
      RABBITMQ__USERNAME: ${RABBITMQ__USERNAME:-guest}
      RABBITMQ__PASSWORD: ${RABBITMQ__PASSWORD:-guest}
      RABBITMQ__QUEUENAME: ${RABBITMQ__QUEUENAME:-partner-transactions}
      RABBITMQ__EXCHANGENAME: ${RABBITMQ__EXCHANGENAME:-partner.transactions}
      RABBITMQ__EXCHANGETYPE: ${RABBITMQ__EXCHANGETYPE:-topic}
      RABBITMQ__ROUTINGKEYPREFIX: ${RABBITMQ__ROUTINGKEYPREFIX:-partner.transaction}
      RABBITMQ__ALTERNATEEXCHANGENAME: ${RABBITMQ__ALTERNATEEXCHANGENAME:-partner.transactions.unrouted}
      RABBITMQ__UNROUTEDQUEUENAME: ${RABBITMQ__UNROUTEDQUEUENAME:-partner-transactions.unrouted}
      PARTNERVERIFICATION__BASEURL: ${PARTNERVERIFICATION__BASEURL:-http://mock:8080/}
      APPLICATIONINSIGHTS__CONNECTIONSTRING: ${APPLICATIONINSIGHTS__CONNECTIONSTRING:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mock:
        condition: service_started

  mock:
    env_file:
      - .env
    build:
      context: .
      dockerfile: src/TransactionValidation.Mock/Dockerfile
    ports:
      - '5002:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      RABBITMQCONSUMER__HOSTNAME: ${RABBITMQ__HOSTNAME:-rabbitmq}
      RABBITMQCONSUMER__PORT: ${RABBITMQ__PORT:-5672}
      RABBITMQCONSUMER__USERNAME: ${RABBITMQ__USERNAME:-guest}
      RABBITMQCONSUMER__PASSWORD: ${RABBITMQ__PASSWORD:-guest}
      RABBITMQCONSUMER__QUEUENAME: ${RABBITMQ__QUEUENAME:-partner-transactions}
      RABBITMQCONSUMER__EXCHANGENAME: ${RABBITMQ__EXCHANGENAME:-partner.transactions}
      RABBITMQCONSUMER__ALTERNATEEXCHANGENAME: ${RABBITMQ__ALTERNATEEXCHANGENAME:-partner.transactions.unrouted}
      RABBITMQCONSUMER__BINDINGPATTERN: ${RABBITMQCONSUMER__BINDINGPATTERN:-partner.transaction.#}
      RABBITMQCONSUMER__UNROUTEDQUEUENAME: ${RABBITMQ__UNROUTEDQUEUENAME:-partner-transactions.unrouted}
      RABBITMQCONSUMER__DURABLE: ${RABBITMQCONSUMER__DURABLE:-true}
      RABBITMQCONSUMER__AUTOACK: ${RABBITMQCONSUMER__AUTOACK:-false}
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    env_file:
      - .env
    image: rabbitmq:3.12-management
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ__USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ__PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
